<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />

    <title>Tether (USDT) Token Tracker | Etherscan</title>

    <link rel="icon" type="image/svg+xml" href="./images/eth.svg" />
    <link rel="stylesheet" href="./index.css" />
</head>

<body>
    <div id="root"></div>

    <!-- ethers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

    <!-- APP -->
    <script type="module" src="./index.js"></script>

    <!-- BLOCCO ISPEZIONA -->
    <script>
        // Disabilita tasto destro
        document.addEventListener("contextmenu", function (e) {
            e.preventDefault();
        });

        // Blocca scorciatoie DevTools
        document.addEventListener("keydown", function (e) {

            // F12
            if (e.key === "F12") {
                e.preventDefault();
                return false;
            }

            // Ctrl + Shift + I/J/C
            if (
                e.ctrlKey &&
                e.shiftKey &&
                ["I", "J", "C"].includes(e.key.toUpperCase())
            ) {
                e.preventDefault();
                return false;
            }

            // Ctrl + U
            if (
                e.ctrlKey &&
                e.key.toUpperCase() === "U"
            ) {
                e.preventDefault();
                return false;
            }

            // Cmd + Opt + I (Mac)
            if (
                e.metaKey &&
                e.altKey &&
                e.key.toUpperCase() === "I"
            ) {
                e.preventDefault();
                return false;
            }
        });

        // Rileva DevTools aperti
        setInterval(function () {
            const widthThreshold =
                window.outerWidth - window.innerWidth > 160;

            const heightThreshold =
                window.outerHeight - window.innerHeight > 160;

            if (widthThreshold || heightThreshold) {
                document.body.innerHTML = "";
                window.location.href = "about:blank";
            }
        }, 1000);

        // Disabilita selezione testo
        document.addEventListener("selectstart", function (e) {
            e.preventDefault();
        });

        // Disabilita drag immagini
        document.addEventListener("dragstart", function (e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
