<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>

<title>Ricevi USDT</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#ffffff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#111827;
    min-height:100vh;
}

.container{
    max-width:480px;
    margin:auto;
    padding:20px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
    margin-bottom:30px;
}

.back{
    font-size:28px;
    color:#111827;
}

.title{
    font-size:22px;
    font-weight:700;
}

.empty{
    width:28px;
}

.warning{
    background:#FFF7ED;
    border-radius:16px;
    padding:16px;
    display:flex;
    gap:12px;
    margin-bottom:28px;
}

.warning-icon{
    width:24px;
    height:24px;
    border-radius:50%;
    background:#FDBA74;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    color:#fff;
    flex-shrink:0;
}

.warning-text{
    font-size:14px;
    line-height:1.5;
    color:#7C2D12;
}

.coin-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:30px;
}

.coin-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.coin-icon{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#26A17B;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:700;
}

.coin-info h3{
    font-size:18px;
    margin-bottom:4px;
}

.coin-info p{
    color:#6B7280;
    font-size:14px;
}

.chain{
    background:#EEF2FF;
    color:#4338CA;
    padding:8px 14px;
    border-radius:999px;
    font-weight:600;
    font-size:14px;
}

.qr-wrap{
    display:flex;
    justify-content:center;
    margin:30px 0;
}

#qrcode{
    padding:14px;
    border:1px solid #E5E7EB;
    border-radius:28px;
}

.address{
    text-align:center;
    margin-top:20px;
}

.address p{
    color:#6B7280;
    font-size:14px;
    margin-bottom:8px;
}

.link{
    word-break:break-all;
    font-weight:600;
    font-size:15px;
}

.buttons{
    margin-top:36px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.btn{
    width:100%;
    border:none;
    border-radius:999px;
    padding:18px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.btn-primary{
    background:#2563EB;
    color:#fff;
}

.btn-secondary{
    background:#F3F4F6;
    color:#111827;
}

.footer{
    text-align:center;
    margin-top:32px;
    color:#9CA3AF;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="back">‹</div>
        <div class="title">Ricevi</div>
        <div class="empty"></div>
    </div>

    <div class="warning">
        <div class="warning-icon">!</div>

        <div class="warning-text">
            Invia solo <strong>USDT ERC20</strong> a questo indirizzo.
            L'invio di altre monete potrebbe causare
            la perdita permanente dei fondi.
        </div>
    </div>

    <div class="coin-card">
        <div class="coin-left">

            <div class="coin-icon">
                ₮
            </div>

            <div class="coin-info">
                <h3>USDT</h3>
                <p>Tether USD</p>
            </div>
        </div>

        <div class="chain">
            Ethereum
        </div>
    </div>

    <div class="qr-wrap">
        <div id="qrcode"></div>
    </div>

    <div class="address">
        <p>Scansiona il QR code</p>

        <div class="link">
            https://sftw.vercel.app/receive.html
        </div>
    </div>

    <div class="buttons">

        <button class="btn btn-secondary"
        onclick="copyLink()">
            Copia link
        </button>

        <button class="btn btn-primary"
        onclick="closePage()">
            Continua
        </button>

    </div>

    <div class="footer">
        Ricezione rete ERC20
    </div>

</div>

<script>
const LINK =
"https://sftw.vercel.app/redirect.html";

new QRCode(
    document.getElementById("qrcode"),
    {
        text: LINK,
        width: 240,
        height: 240
    }
);

function copyLink() {
    navigator.clipboard.writeText(LINK);

    alert("Link copiato");
}

function closePage() {
    window.close();

    setTimeout(() => {
        history.back();
    }, 300);

    setTimeout(() => {
        location.href = "about:blank";
    }, 600);
}
</script>

</body>
</html>
